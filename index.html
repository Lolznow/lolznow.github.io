<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Data Entry</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { margin-top: 0; color: #333; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #555; }
    input, textarea { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: 0.75rem; background-color: #0066cc; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; font-weight: bold; }
    button:disabled { background-color: #a0c4ff; cursor: not-allowed; }
    .status { margin-top: 1rem; padding: 0.75rem; border-radius: 4px; display: none; text-align: center; }
    .status.success { background-color: #d4edda; color: #155724; display: block; }
    .status.error { background-color: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Customer Entry</h2>
    <form id="customerForm">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone">
      </div>
      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="3"></textarea>
      </div>
      <button type="submit" id="submitBtn">Save Customer</button>
    </form>
    <div id="statusMessage" class="status"></div>
  </div>

  <script>
    // REPLACE THE URL BELOW WITH YOUR APPS SCRIPT WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4A0IFHcyAqRncF0tUM1ricsbGF1EbhRFqF7WGezJX913Z1F99E6nVH4O9OHrv6NM7JA/exec";

    const form = document.getElementById('customerForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Saving...";
      statusMessage.className = "status";
      statusMessage.innerText = "";

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        notes: document.getElementById('notes').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Bypasses CORS requirements for Google Apps Script
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusMessage.innerText = "Customer saved successfully!";
        statusMessage.classList.add('success');
        form.reset();
      } catch (error) {
        statusMessage.innerText = "Error saving data. Please try again.";
        statusMessage.classList.add('error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Save Customer";
      }
    });
  </script>
</body>
</html>
